# app.smedatacenter.xyz：静态前端 + 同源转发网页接口。
# 启用前提：app 证书已签发，且 /opt/smedc/app/current 已指向一个已校验的版本。
# api.smedatacenter.xyz 仍由服务仓库自己的站点配置管理，两者互不覆盖。

server {
  listen 80;
  listen [::]:80;
  server_name app.smedatacenter.xyz;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/smedc-acme;
    try_files $uri =404;
  }
  location / {
    return 301 https://app.smedatacenter.xyz$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name app.smedatacenter.xyz;

  ssl_certificate /etc/letsencrypt/live/app.smedatacenter.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.smedatacenter.xyz/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /opt/smedc/app/current;
  autoindex off;
  client_max_body_size 1m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # 台账精确选择的请求上限由 API 定义，5,000 条选择可能超过默认 1 MiB。
  location ~ ^/api/web/v1/ledger/(coverage|downloads)$ {
    client_max_body_size 16m;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:3000;
  }

  location /api/web/v1/ {
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:3000;
  }

  # 代理响应保留后端各自的 CSP，包括认证页面 nonce 和同源 PDF 嵌入权限。
  location /oauth/device/ {
    proxy_pass http://127.0.0.1:3000;
  }
  location /auth/password/ {
    proxy_pass http://127.0.0.1:3000;
  }

  # 构建产物文件名带内容哈希，可以长期缓存。
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/smedc-app-security.conf;
  }

  # 历史版本目录不对外暴露。
  location ^~ /releases/ {
    return 404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/smedc-app-security.conf;
    try_files $uri $uri/ /index.html;
  }
}
