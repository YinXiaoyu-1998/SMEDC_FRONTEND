# app.smedatacenter.xyz：静态前端 + 同源转发网页接口。
# 启用前提：app 证书已签发，且 /opt/smedc/app/current 已指向一个已校验的版本。
# api.smedatacenter.xyz 仍由服务仓库自己的站点配置管理，两者互不覆盖。

server {
  listen 80;
  listen [::]:80;
  server_name app.smedatacenter.xyz;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/smedc-acme;
    try_files $uri =404;
  }
  location / {
    return 301 https://app.smedatacenter.xyz$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name app.smedatacenter.xyz;

  ssl_certificate /etc/letsencrypt/live/app.smedatacenter.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.smedatacenter.xyz/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /opt/smedc/app/current;
  autoindex off;
  # 网页面没有上传；接口上传走 api 域，这里保持 nginx 默认值并显式写明。
  client_max_body_size 1m;

  # HTML 默认不缓存；带哈希的静态产物在 /assets/ 内单独覆盖。
  add_header Cache-Control "no-store" always;
  include /etc/nginx/snippets/smedc-app-security.conf;

  # 浏览器接口：唯一的数据入口，前端只认这个相对前缀。
  # 关闭缓冲，保证台账 PDF 预览与下载是流式的。
  location /api/web/v1/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:3000;
  }

  # 仍然是服务端渲染的两个一次性页面：设备授权与首次设密码。
  location /oauth/device/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000;
  }
  location /auth/password/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3000;
  }

  # 构建产物文件名带内容哈希，可以长期缓存。
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/smedc-app-security.conf;
  }

  # 历史版本目录不对外暴露。
  location ^~ /releases/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
