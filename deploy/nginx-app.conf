# app.smedatacenter.xyz：静态前端 + 同源转发网页接口。
# 启用前提：app 证书已签发，且 /opt/smedc/app/current 已指向一个已校验的版本。
# api.smedatacenter.xyz 仍由服务仓库自己的站点配置管理，两者互不覆盖。

server {
  listen 80;
  listen [::]:80;
  server_name app.smedatacenter.xyz;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/smedc-acme;
    try_files $uri =404;
  }
  location / {
    return 301 https://app.smedatacenter.xyz$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name app.smedatacenter.xyz;

  ssl_certificate /etc/letsencrypt/live/app.smedatacenter.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.smedatacenter.xyz/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /opt/smedc/app/current;
  autoindex off;
  client_max_body_size 1m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # 台账精确选择的请求上限由 API 定义，5,000 条选择可能超过默认 1 MiB。
  location ~ ^/api/web/v1/ledger/(coverage|downloads)$ {
    client_max_body_size 16m;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:3000;
  }

  # 单张巡检原图上限为 10 MiB，另留 multipart 字段和边界开销。
  location = /api/web/v1/inspections/photos {
    client_max_body_size 11m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:3000;
  }

  location /api/web/v1/ {
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:3000;
  }

  # 保留已发出的链接路径，页面交给 React，旧版表单提交继续转发。
  location ~ ^(/oauth/device/verify|/auth/password/setup(/form)?)$ {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/smedc-app-security.conf;
    try_files /index.html =404;
  }

  # 保留旧版认证表单和 API 各自的安全响应头。
  location /oauth/device/ {
    proxy_pass http://127.0.0.1:3000;
  }
  location /auth/password/ {
    proxy_pass http://127.0.0.1:3000;
  }

  # Only the initial email page loads Aliyun CAPTCHA. Verification and password entry use a fresh document.
  location = /register/ {
    return 308 /register$is_args$args;
  }

  location = /register {
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://o.alicdn.com https://g.alicdn.com https://x.alicdn.com; style-src 'self' 'unsafe-inline' https://o.alicdn.com https://g.alicdn.com https://x.alicdn.com https://static-captcha.aliyuncs.com; img-src 'self' data: blob: https://o.alicdn.com https://g.alicdn.com https://x.alicdn.com https://static-captcha.aliyuncs.com; font-src 'self' https://static-captcha.aliyuncs.com; connect-src 'self' https://*.captcha-open.aliyuncs.com https://*.captcha-open-b.aliyuncs.com https://cloudauth-device.aliyuncs.com https://cloudauth-device-dualstack.cn-shanghai.aliyuncs.com https://cn-shanghai.device.saf.aliyuncs.com; frame-src https://*.captcha-open.aliyuncs.com https://*.captcha-open-b.aliyuncs.com; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    try_files /index.html =404;
  }

  # 构建产物文件名带内容哈希，可以长期缓存。
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/smedc-app-security.conf;
  }

  # 历史版本目录不对外暴露。
  location ^~ /releases/ {
    return 404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/smedc-app-security.conf;
    try_files $uri $uri/ /index.html;
  }
}
