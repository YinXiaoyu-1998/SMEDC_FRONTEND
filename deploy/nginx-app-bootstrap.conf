# 首次签发 app 证书时的临时站点：只开放 ACME challenge，其余路径 404。
# 证书可用后必须换成 nginx-app.conf，二者不能同时启用。
server {
  listen 80;
  listen [::]:80;
  server_name app.smedatacenter.xyz;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/smedc-acme;
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
