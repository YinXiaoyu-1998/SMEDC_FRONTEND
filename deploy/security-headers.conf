# app 站点的安全响应头。server 与每个自带 add_header 的 location 都必须 include 它，
# 因为 nginx 的 add_header 一旦在 location 内出现就不再继承 server 级配置。
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 台账预览是同源 iframe，因此 frame-src 需要 'self' 与 blob:；其余一律不放开。
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
